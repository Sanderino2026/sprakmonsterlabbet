<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vi läser dina svar — Språkmönsterlabbet</title>
<style>
  @font-face{font-family:'Crimson Pro';src:url('assets/fonts/CrimsonPro-VariableFont_wght.ttf');font-weight:200 900;font-style:normal;}
  :root {
    --font-display: 'Crimson Pro', Georgia, serif;
    --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --color-primary: #FFA047;
    --color-text: #2B2B2B;
    --color-text-light: rgba(43,43,43,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: #FFFFFF;
    color: var(--color-text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .wait-wrap {
    text-align: center;
    max-width: 480px;
  }
  .wait-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 32px;
    opacity: 0.7;
  }
  .wait-title {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .wait-text {
    font-size: 16px;
    color: var(--color-text-light);
    line-height: 1.7;
    margin-bottom: 40px;
  }
  .wait-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .wait-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-primary);
    opacity: 0.3;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .wait-dots span:nth-child(2) { animation-delay: 0.2s; }
  .wait-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .wait-error {
    color: #c0392b;
    font-size: 14px;
    margin-top: 24px;
    display: none;
  }
</style>
</head>
<body>
<div class="wait-wrap">
  <img class="wait-icon" src="assets/piktogram/modul-min-profil.svg" alt="">
  <div class="wait-title">Vi läser dina svar</div>
  <div class="wait-text">Det tar en halv minut. Vi går igenom hur du formulerat dig och letar efter mönstret i ordvalen.</div>
  <div class="wait-dots"><span></span><span></span><span></span></div>
  <div class="wait-error" id="waitError"></div>
</div>

<script>
(function() {
  var API = 'https://sprakmonsterlabbet.alexander-894.workers.dev';
  var profileId = sessionStorage.getItem('sml_profile_id');

  if (!profileId) {
    document.getElementById('waitError').textContent = 'Ingen profil hittad. Gå tillbaka och fyll i formuläret.';
    document.getElementById('waitError').style.display = 'block';
    return;
  }

  var attempts = 0;
  var maxAttempts = 40; // 40 × 3s = 2 min

  function poll() {
    attempts++;
    fetch(API + '/api/report-by-profile?profile_id=' + encodeURIComponent(profileId))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.token && data.ready) {
          // Rapport klar — navigera
          window.location.href = '/gratis-rapport?token=' + data.token;
          return;
        }
        if (attempts >= maxAttempts) {
          document.getElementById('waitError').textContent = 'Det tar längre tid än vanligt. Kolla din e-post — rapporten skickas dit när den är klar.';
          document.getElementById('waitError').style.display = 'block';
          return;
        }
        setTimeout(poll, 3000);
      })
      .catch(function() {
        if (attempts < maxAttempts) setTimeout(poll, 3000);
      });
  }

  setTimeout(poll, 3000);
})();
</script>
</body>
</html>
