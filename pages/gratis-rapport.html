<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Din språkprofil — Språkmönsterlabbet</title>
<style>
  @font-face{font-family:'Crimson Pro';src:url('assets/fonts/CrimsonPro-VariableFont_wght.ttf');font-weight:200 900;font-style:normal;}
  @font-face{font-family:'Crimson Pro';src:url('assets/fonts/CrimsonPro-Italic-VariableFont_wght.ttf');font-weight:200 900;font-style:italic;}

  :root {
    --font-display: 'Crimson Pro', Georgia, serif;
    --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --color-primary: #FFA047;
    --color-text: #2B2B2B;
    --color-text-light: rgba(43,43,43,0.5);
    --color-text-subtle: rgba(43,43,43,0.4);
    --color-text-body: rgba(43,43,43,0.65);
    --color-border: rgba(43,43,43,0.08);
    --color-bg: #FFFFFF;
    --color-bg-subtle: rgba(43,43,43,0.025);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--color-bg);
    color: var(--color-text);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #FFA047; text-decoration: none; }
  a:hover { color: #e0863a; }

  /* LAYOUT */
  .gr-layout {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* HEADER */
  .gr-header {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--color-border);
  }
  .gr-header-meta {
    font-size: 13px;
    color: var(--color-text-light);
  }

  /* CONTENT AREA */
  .gr-content-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
  }

  /* SIDEBAR */
  .gr-sidebar {
    flex: 0 0 220px;
    min-width: 220px;
    padding: 32px 24px 40px 0;
  }
  .gr-sidebar-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FFA047;
    margin-bottom: 18px;
  }
  .gr-sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .gr-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    font-size: 13px;
    border-left: 2px solid transparent;
  }
  .gr-nav-item.active {
    background: rgba(255,160,71,0.08);
    border-left-color: #FFA047;
    border-radius: 0 6px 6px 0;
  }
  .gr-nav-item.active span { color: var(--color-text); }
  .gr-nav-item span { color: rgba(43,43,43,0.35); }
  .gr-nav-icon { width: 16px; height: 16px; opacity: 0.28; }
  .gr-nav-item.active .gr-nav-icon { opacity: 1; }

  /* SIDEBAR CTA */
  .gr-sidebar-cta {
    border-top: 1px solid var(--color-border);
    margin-top: 24px;
    padding-top: 24px;
  }
  .gr-cta-text {
    font-size: 13px;
    color: #FFA047;
    margin-bottom: 8px;
  }
  .gr-cta-price {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 500;
    color: var(--color-text);
    margin-bottom: 4px;
  }
  .gr-cta-meta {
    font-size: 11px;
    color: var(--color-text-subtle);
    margin-bottom: 16px;
  }
  .gr-cta-btn {
    display: block;
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: #FFA047;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    padding: 15px 0;
    cursor: pointer;
    transition: opacity 0.15s;
    text-align: center;
  }
  .gr-cta-btn:hover { opacity: 0.85; }
  .gr-cta-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .gr-cta-stripe {
    font-size: 11px;
    color: var(--color-text-subtle);
    margin-top: 14px;
    text-align: center;
  }

  /* MAIN */
  .gr-main {
    flex: 1 1 480px;
    min-width: 300px;
    padding: 40px 0 96px;
    border-left: 1px solid rgba(43,43,43,0.06);
    padding-left: 40px;
  }
  .gr-main-inner { max-width: 640px; }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 120px 24px;
  }
  .loading-spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 14px;
    color: var(--color-text-light);
  }

  .error-msg {
    text-align: center;
    padding: 120px 24px;
    font-size: 18px;
    color: var(--color-text-light);
  }

  /* EYEBROW */
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FFA047;
    margin-bottom: 16px;
  }

  /* SECTION */
  .section-title {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.2;
    color: var(--color-text);
    margin-bottom: 8px;
  }
  .section-divider {
    width: 40px;
    height: 1px;
    background: rgba(43,43,43,0.15);
    margin-top: 16px;
    margin-bottom: 32px;
  }

  /* BLOCK A — Om mönstret */
  .block-om {
    border-left: 1px solid rgba(43,43,43,0.12);
    padding-left: 24px;
    margin-bottom: 40px;
  }
  .block-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-text-subtle);
    margin-bottom: 16px;
  }
  .block-om p {
    color: var(--color-text-body);
    margin-bottom: 16px;
    line-height: 1.75;
  }
  .block-om p:last-child { margin-bottom: 0; }

  /* Pattern reveal */
  .pattern-reveal {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FFA047;
    margin-top: 48px;
    margin-bottom: 16px;
  }

  /* BLOCK B — Resultat */
  .block-resultat {
    border-left: 1px solid #FFA047;
    padding-left: 24px;
  }
  .block-resultat p {
    color: var(--color-text-body);
    margin-bottom: 16px;
    line-height: 1.75;
  }
  .block-resultat p:last-child { margin-bottom: 0; }

  /* Scale viz card */
  .viz-card {
    border: 1px solid var(--color-border);
    border-radius: 0 10px 0 10px;
    padding: 28px 36px;
    margin: 32px 0;
    background: var(--color-bg-subtle);
  }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 400;
    color: var(--color-text-light);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .scale-track {
    position: relative;
    height: 2px;
    background: rgba(43,43,43,0.1);
    border-radius: 1px;
    margin: 18px 0 8px;
  }
  .scale-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: #FFA047;
    border-radius: 1px;
  }
  .scale-thumb {
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    background: #FFFFFF;
    border: 1.5px solid #FFA047;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .scale-value {
    text-align: center;
    font-size: 12px;
    color: #FFA047;
  }
  .strength-tydlig { color: #FFA047; }
  .strength-trolig { color: #FFA047; }
  .strength-mojlig { color: var(--color-text-subtle); }

  /* SELL SECTION */
  .sell-separator {
    height: 1px;
    background: var(--color-border);
    margin: 64px 0;
  }
  .sell-title {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.3;
    color: var(--color-text);
    margin-bottom: 20px;
  }
  .sell-text {
    font-size: 15px;
    color: var(--color-text-body);
    line-height: 1.8;
    margin-bottom: 32px;
  }
  .sell-price {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 500;
    color: var(--color-text);
    margin-bottom: 6px;
  }
  .sell-price-meta {
    font-size: 12px;
    color: var(--color-text-subtle);
    margin-bottom: 24px;
  }
  .sell-btn {
    display: inline-block;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: #FFA047;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    padding: 15px 36px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .sell-btn:hover { opacity: 0.85; }
  .sell-btn:disabled { opacity: 0.3; cursor: default; }
  .sell-stripe-note {
    font-size: 11px;
    color: var(--color-text-subtle);
    margin-top: 14px;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 40px 0 0;
    margin-top: 56px;
    border-top: 1px solid var(--color-border);
    font-size: 11px;
    color: var(--color-text-subtle);
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .gr-sidebar { display: none; }
    .gr-main { border-left: none; padding-left: 0; }
    .gr-content-wrap { flex-direction: column; }
    .section-title { font-size: 28px; }
    .block-om, .block-resultat { padding-left: 16px; }
    .viz-card { padding: 24px 20px; }
    .sell-title { font-size: 24px; }
    .sell-btn { padding: 14px 32px; width: 100%; text-align: center; }
  }

  /* PRINT */
  @media print {
    .gr-sidebar { display: none !important; }
    .gr-main { border-left: none !important; padding-left: 0 !important; }
    .sell-separator, .sell-section, .footer { display: none !important; }
    body { background: white; color: #2B2B2B; }
  }
</style>
<link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"></head>
<body>

<div class="gr-layout">
  <!-- HEADER -->
  <div class="gr-header" id="grHeader" style="display:none;">
    <img src="assets/logotype_horizontal.webp" alt="holmberg &amp; friends" style="height:18px;">
    <span class="gr-header-meta" id="grHeaderMeta"></span>
  </div>

  <div class="gr-content-wrap">
    <!-- SIDEBAR -->
    <aside class="gr-sidebar" id="grSidebar">
      <div class="gr-sidebar-label">DITT RESULTAT</div>
      <div class="gr-sidebar-nav">
        <div class="gr-nav-item active"><span>F&ouml;rst&aring;else</span></div>
        <div class="gr-nav-item"><img class="gr-nav-icon" src="assets/piktogram/motivationsriktning-till.svg" alt=""><span>Motivationsriktning</span></div>
        <div class="gr-nav-item"><img class="gr-nav-icon" src="assets/piktogram/beslutsram-intern.svg" alt=""><span>Beslutsram</span></div>
        <div class="gr-nav-item"><img class="gr-nav-icon" src="assets/piktogram/sinneskommunikationskanal-se.svg" alt=""><span>Sinneskommunikationskanal</span></div>
        <div class="gr-nav-item"><img class="gr-nav-icon" src="assets/piktogram/omfang-generell.svg" alt=""><span>Omf&aring;ng</span></div>
      </div>
      <div class="gr-sidebar-cta" id="sidebarCta" style="display:none;">
        <div class="gr-cta-text">L&aring;s upp hela rapporten</div>
        <div class="gr-cta-price" id="ctaPrice">199 kr</div>
        <div class="gr-cta-meta" id="ctaMeta">Kampanjpris via partiledarserien &middot; t.o.m. 30 september</div>
        <button class="gr-cta-btn" id="sidebarBuyBtn">K&Ouml;P HELA RAPPORTEN</button>
        <div class="gr-cta-stripe">S&auml;ker betalning via Stripe</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="gr-main">
      <div class="gr-main-inner" id="mainWrap">
        <div class="loading" id="loadingState">
          <div class="loading-spinner"></div>
          <div class="loading-text">H&auml;mtar din rapport...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var API = 'https://sprakmonsterlabbet.alexander-894.workers.dev';
  var RAPPORT_PRICE_ID = 'price_1TE9RZHrTws6MQZqVEhOtaY0';
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var wrap = document.getElementById('mainWrap');

  // ── Payment success screen ──────────────────────────────────
  if (params.get('payment') === 'success') {
    var savedProfileId = sessionStorage.getItem('checkout_profile_id');

    if (savedProfileId) {
      wrap.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div class="loading-text">Din rapport genereras... detta kan ta upp till 30 sekunder.</div></div>';
      sessionStorage.removeItem('checkout_profile_id');
      var attempts = 0;
      var maxAttempts = 10;
      function pollReport() {
        attempts++;
        fetch(API + '/api/report-by-profile?profile_id=' + encodeURIComponent(savedProfileId))
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.ready && data.token) {
              window.location.href = 'https://sprakmonsterlabbet.holmbergfriends.com/rapport.html?token=' + encodeURIComponent(data.token);
            } else if (attempts < maxAttempts) {
              setTimeout(pollReport, 3000);
            } else {
              wrap.innerHTML = '<div style="text-align:center;padding:80px 24px;">'
                + '<div class="eyebrow">SPR\u00c5KM\u00d6NSTERLABBET</div>'
                + '<div class="section-title">Tack f\u00f6r ditt k\u00f6p!</div>'
                + '<p style="font-size:14px;color:rgba(43,43,43,0.65);line-height:1.8;margin-top:24px;">Din rapport genereras och skickas till din e-post inom n\u00e5gra minuter.</p>'
                + '<div class="footer">holmberg &amp; friends</div>';
            }
          })
          .catch(function() {
            if (attempts < maxAttempts) {
              setTimeout(pollReport, 3000);
            }
          });
      }
      setTimeout(pollReport, 3000);
    } else {
      wrap.innerHTML = '<div style="text-align:center;padding:80px 24px;">'
        + '<div class="eyebrow">SPR\u00c5KM\u00d6NSTERLABBET</div>'
        + '<div class="section-title">Tack f\u00f6r ditt k\u00f6p!</div>'
        + '<p style="font-size:14px;color:rgba(43,43,43,0.65);line-height:1.8;margin-top:24px;">Din fullst\u00e4ndiga rapport genereras nu och skickas till din e-post inom n\u00e5gra minuter.</p>'
        + '<div class="footer">holmberg &amp; friends</div>';
    }
    return;
  }

  if (!token) {
    wrap.innerHTML = '<div class="error-msg">Ogiltig l\u00e4nk.</div>';
    return;
  }

  fetch(API + '/api/gratis-rapport?token=' + encodeURIComponent(token))
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
    .then(function(r) {
      if (!r.ok) throw new Error(r.data.error || 'Rapport ej hittad');
      renderPage(r.data);
    })
    .catch(function(err) {
      wrap.innerHTML = '<div class="error-msg">' + esc(err.message) + '</div>';
    });

  function renderPage(data) {
    var name = data.name || 'Respondent';
    var situation = data.situation || 'Arbete';
    var profileId = data.profile_id || '';
    var f = data.f\u00f6rst\u00e5else || {};
    var pedText = data.pedagogik_text || '';
    var signal = f.signal || '';
    var styrka = f.styrka || '';
    var skala = f.skala || 5;
    var analys = f.analys || '';
    var date = new Date().toLocaleDateString('sv-SE');

    // Show header
    document.getElementById('grHeader').style.display = 'flex';
    document.getElementById('grHeaderMeta').textContent = name + ' \u00b7 ' + date;

    // Show sidebar CTA
    document.getElementById('sidebarCta').style.display = 'block';

    var html = '';

    // RUBRIK — dynamisk baserat på signal
    var isAlt = signal && signal.toLowerCase().indexOf('alternativ') !== -1;
    var rubrik = isAlt ? 'Du b\u00f6rjar i m\u00f6jligheterna' : 'Du b\u00f6rjar i ordningen';

    // Storleksklass ist\u00e4llet f\u00f6r exakta tal
    var pct = ((skala - 1) / 9 * 100);
    var storleksklass = '';
    if (pct <= 55) storleksklass = 'J\u00e4mnt f\u00f6rdelat';
    else if (pct <= 65) storleksklass = '\u00d6vervikt \u00e5t ' + (isAlt ? 'alternativ' : 'procedur');
    else if (pct <= 80) storleksklass = 'Tydlig \u00f6vervikt \u00e5t ' + (isAlt ? 'alternativ' : 'procedur');
    else if (pct <= 90) storleksklass = 'Stark \u00f6vervikt \u00e5t ' + (isAlt ? 'alternativ' : 'procedur');
    else storleksklass = 'N\u00e4stan uteslutande ' + (isAlt ? 'alternativ' : 'procedur');

    html += '<div class="eyebrow">F\u00d6RST\u00c5ELSE \u00b7 DITT GRATISM\u00d6NSTER</div>';
    html += '<div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;">';
    html += '<img src="assets/omslag/omslag-3-knut.svg" alt="" style="width:52px;height:52px;flex-shrink:0;">';
    html += '<div class="section-title">' + esc(rubrik) + '</div>';
    html += '</div>';
    html += '<p style="font-size:14px;color:var(--color-text-light);margin-bottom:4px;">' + esc(storleksklass) + '</p>';
    html += '<div class="section-divider"></div>';

    // Skalstavern utan siffror
    html += '<div class="viz-card">';
    html += '<div class="scale-labels"><span>PROCEDUR</span><span>ALTERNATIV</span></div>';
    html += '<div class="scale-track">';
    html += '<div class="scale-fill" style="width:' + pct.toFixed(1) + '%"></div>';
    html += '<div class="scale-thumb" style="left:' + pct.toFixed(1) + '%"></div>';
    html += '</div>';
    html += '<div class="scale-value">' + esc(storleksklass) + '</div>';
    html += '</div>';

    // Block A — Om m\u00f6nstret
    html += '<div class="block-om">';
    html += '<div class="block-label"><img src="assets/piktogram/omfang-generell.svg" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:8px;opacity:0.5;">OM M\u00d6NSTRET</div>';
    html += textToHtml(pedText);
    html += '</div>';

    // Block B — Personlig analys med sektionsrubriker
    html += '<div class="block-resultat">';
    html += textToHtml(analys);
    html += '</div>';

    // SELL SECTION (inline)
    html += '<div class="sell-separator"></div>';
    html += '<div class="sell-section">';
    html += '<div class="sell-title">Din fullst\u00e4ndiga spr\u00e5kprofil</div>';
    html += '<div class="sell-text">';
    html += 'Det h\u00e4r \u00e4r bara ett av fem kommunikationsm\u00f6nster i din profil. Den fullst\u00e4ndiga rapporten inneh\u00e5ller:<br><br>';
    html += '\u00b7 Motivationsriktning \u2014 vad som driver din kommunikation<br>';
    html += '\u00b7 Beslutsram \u2014 var du h\u00e4mtar din tyngd<br>';
    html += '\u00b7 Sinneskommunikationskanal \u2014 vilket sinne som dominerar ditt spr\u00e5k<br>';
    html += '\u00b7 Omf\u00e5ng \u2014 hur brett eller specifikt du kommunicerar<br>';
    html += '\u00b7 En helhetsbild av hur dina m\u00f6nster samspelar';
    html += '</div>';

    var now = new Date();
    var kampanj = now < new Date('2026-10-01');
    html += '<div class="sell-price">' + (kampanj ? '199 kr' : '499 kr') + '</div>';
    if (kampanj) html += '<div class="sell-price-meta">Kampanjpris via partiledarserien \u00b7 t.o.m. 30 september. Ordinarie 499 kr.</div>';
    else html += '<div class="sell-price-meta">Eng\u00e5ngsbetalning. Rapporten levereras direkt till din e-post.</div>';
    html += '<button class="sell-btn" id="buyBtn">K\u00d6P HELA RAPPORTEN</button>';
    html += '<div class="sell-stripe-note">S\u00e4ker betalning via Stripe</div>';
    html += '</div>';

    html += '<div class="footer"><img src="assets/logotype_horizontal.webp" alt="holmberg &amp; friends" style="height:12px;opacity:0.6;"></div>';

    wrap.innerHTML = html;

    // Buy button handler
    function handleBuy(btn) {
      btn.disabled = true;
      btn.textContent = 'Laddar...';

      fetch(API + '/api/stripe/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          priceId: RAPPORT_PRICE_ID,
          price_type: 'rapport_full',
          profile_id: profileId,
        }),
      })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.ok && data.url) {
            sessionStorage.setItem('checkout_profile_id', profileId);
            window.location.href = data.url;
          } else {
            btn.disabled = false;
            btn.textContent = 'K\u00d6P HELA RAPPORTEN';
            alert('N\u00e5got gick fel. F\u00f6rs\u00f6k igen.');
          }
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'K\u00d6P HELA RAPPORTEN';
          alert('N\u00e5got gick fel. F\u00f6rs\u00f6k igen.');
        });
    }

    // Main buy button
    document.getElementById('buyBtn').addEventListener('click', function() {
      handleBuy(this);
    });

    // Sidebar buy button
    document.getElementById('sidebarBuyBtn').addEventListener('click', function() {
      handleBuy(this);
    });
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatMarkdown(s) {
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s;
  }

  function textToHtml(text) {
    if (!text) return '';
    var parts = text.split(/\n\n+/);
    var html = '';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim();
      if (!p) continue;
      html += '<p>' + formatMarkdown(esc(p.replace(/\n/g, ' '))) + '</p>';
    }
    return html;
  }

})();
</script>
